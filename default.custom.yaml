customization:
  distribution_code_name: Weasel
  distribution_version: 0.16.1
  generator: "Rime::SwitcherSettings"
  modified_time: "Mon Sep  9 11:46:06 2024"
  rime_version: 1.11.2
patch:
  app_options:
    Code: {ascii_mode: true, vim_mode: true}
    mpv: {ascii_mode: true, vim_mode: true}
    devenv: {ascii_mode: true, vim_mode: true}
    WindowsTerminal: {ascii_mode: true, vim_mode: true}
    Google Chrome: {ascii_mode: true, vim_mode: true}
    Listary: {ascii_mode: true, vim_mode: true}
  ascii_composer:
    good_old_caps_lock: true
    switch_key: {Caps_Lock: commit_code, Control_L: noop, Control_R: noop, Shift_L: commit_code, Shift_R: commit_code}
  key_binder:
    bindings: [{accept: semicolon, send: 2, when: has_menu}, {accept: apostrophe, send: 3, when: has_menu}, {accept: bracketleft, send: Page_Up, when: has_menu}, {accept: bracketright, send: Page_Down, when: has_menu}, {accept: "Shift+Tab", send: Page_Up, when: has_menu}, {accept: Tab, send: Page_Down, when: has_menu}]
  menu:
    page_size: 5
  punctuator:
    full_shape: {" ": {commit: "　"}, "!": {commit: "！"}, "\"": {pair: ["“", "”"]}, "#": ["＃", "⌘"], "$": "￥", "%": "％", "&": "＆", "'": {pair: ["‘", "’"]}, "(": "（", ")": "）", "*": ["＊", "・", "×"], "+": "＋", ",": {commit: "，"}, "-": "－", .: {commit: "。"}, "/": ["／", "÷"], ":": {commit: "："}, ";": {commit: "；"}, "<": ["《", "〈", "«", "‹"], "=": "＝", ">": ["》", "〉", "»", "›"], "?": {commit: "？"}, "@": "＠", "[": ["「", "【", "〔", "［"], "\\": ["、", "＼"], "]": ["」", "】", "〕", "］"], "^": {commit: "……"}, _: "——", "`": "｀", "{": ["『", "〖", "｛"], "|": ["·", "｜", "§", "¦"], "}": ["』", "〗", "｝"], "~": "～"}
    half_shape: {"!": {commit: "！"}, "\"": {pair: ["“", "”"]}, "#": "#", "$": "￥", "%": ["%", "％", "°", "℃"], "&": "&", "'": {pair: ["‘", "’"]}, "(": "（", ")": "）", "*": "*", "+": "+", ",": {commit: "，"}, "-": {commit: "-"}, .: {commit: "。"}, "/": "/", ":": {commit: "："}, ";": {commit: "；"}, "<": {commit: "《"}, "=": {commit: "="}, ">": {commit: "》"}, "?": {commit: "？"}, "@": "@", "[": {commit: "【"}, "\\": {commit: "、"}, "]": {commit: "】"}, "^": {commit: "……"}, _: "——", "`": "`", "{": "「", "|": "|", "}": "」", "~": "~"}
  recognizer:
    patterns: {email: "^[-_.0-9A-Za-z]+@.*$", uppercase: "[A-Z][-_+.'0-9A-Za-z]*$", url: "^(www[.]|https?:|ftp[.:]|mailto:|file:|localhost).*$|^[a-z]+[.].+$"}
  schema_list:
    - {schema: wubi86_jidian_pinyin}
  switcher:
    abbreviate_options: true
    caption: "【 输入法设置 】"
    hotkeys: ["Control+0", "Shift+Control+0"]
    option_list_separator: "｜"